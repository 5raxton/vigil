name: CI

# Builds, tests, and lints every Vigil binary on each push and pull request.
# The `-D warnings` clippy pass keeps the tree warning-free and the release
# build verifies the LTO / panic=abort profile.
#
# Uses the standard rust-toolchain / rust-cache actions (which Forgejo's
# act_runner resolves natively), rather than hand-rolling a rustup install in
# a shell, because act resets PATH between steps.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # Each step runs in a fresh shell with a reset PATH, so hand-rolling a
      # rustup install across steps is fragile. The standard toolchain action
      # manages the install, PATH updates, and clippy component reliably.
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (all targets)
        run: cargo build --all-targets --locked

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Lint (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release profile
        run: cargo build --release --locked
