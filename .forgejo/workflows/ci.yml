name: CI

# Builds, tests, and lints every Vigil binary on each push and pull request.
# The `-D warnings` clippy pass keeps the tree warning-free and the release
# build verifies the LTO / panic=abort profile.
#
# The self-hosted act_runner resolves actions from the data.forgejo.org mirror,
# which only hosts first-party `actions/*` repos, so third-party marketplace
# actions (dtolnay/rust-toolchain, Swatinem/rust-cache) are unavailable here.
# We therefore use only `actions/checkout` plus shell, and explicitly add the
# rustup bin dir to $PATH on every step (act resets PATH between steps).

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add clippy
          rustc --version
          cargo --version

      - name: Build (all targets)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --all-targets --locked

      - name: Run tests
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --all-targets --locked

      - name: Lint (warnings are errors)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo clippy --all-targets --locked -- -D warnings

      - name: Build release profile
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --locked
