[package]
name = "vigil"
version = "0.1.0"
edition = "2021"
description = "A fast, memory-safe Linux init system and process supervisor"
license = "GPL-3.0-or-later"
repository = "https://github.com/vigil-init/vigil"
keywords = ["init", "supervisor", "linux", "system"]
categories = ["system-tools"]

[[bin]]
name = "vigil"
path = "src/bin/vigil.rs"

[[bin]]
name = "vigil-scan"
path = "src/bin/vigil-scan.rs"

[[bin]]
name = "vigil-supervise"
path = "src/bin/vigil-supervise.rs"

[[bin]]
name = "vigil-ctl"
path = "src/bin/vigil-ctl.rs"

[[bin]]
name = "vigillog"
path = "src/bin/vigillog.rs"

[dependencies]
nix = { version = "0.29", default-features = false, features = [
    "signal",
    "process",
    "mount",
    "fs",
    "poll",
    "resource",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
users = "0.11"
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
